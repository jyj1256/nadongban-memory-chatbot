<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나동반 · Long-term Memory Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-mark">N</div>
      <div>
        <p class="eyebrow">TIME-AWARE MEMORY ASSISTANT</p>
        <h1>나동반</h1>
        <p class="subtitle">대화 속 중요한 순간을 기억하고 다시 연결합니다.</p>
      </div>
      <div class="status"><span></span> Pinecone memory</div>
    </header>

    <section class="panel">
      <div id="messages" class="messages" aria-live="polite">
        <article class="message bot">
          <div class="avatar">N</div>
          <div class="bubble">
            안녕하세요. 이전 대화를 기억하는 나동반입니다.<br>
            오늘 있었던 일이나 나중에 기억하고 싶은 내용을 말해 주세요.
          </div>
        </article>
      </div>

      <form id="chat-form" class="composer">
        <button id="voice" class="icon-button" type="button" aria-label="음성 입력">◉</button>
        <input id="message" maxlength="2000" autocomplete="off"
               placeholder="기억하고 싶은 이야기를 입력하세요" required>
        <button class="send" type="submit">보내기</button>
      </form>
      <div class="footer-row">
        <span id="memory-count">저장된 기억 0개</span>
        <button id="clear" class="text-button" type="button">기억 초기화</button>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
